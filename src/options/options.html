<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VSA Ext</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1>Shadow Tracking</h1>
    <div class="month-nav">
      <button id="prev-month" type="button">&lt;</button>
      <input id="month" type="month">
      <button id="next-month" type="button">&gt;</button>
    </div>
  </header>

  <details id="setup">
    <summary>Settings</summary>
    <label for="timesheet-url">VSA timesheet URL</label>
    <div class="url-row">
      <input id="timesheet-url" type="url" placeholder="https://your-company.vsactivity.com/o_services/timesheetspivot/">
      <button id="save-url" type="button">Save &amp; grant access</button>
      <button id="open-timesheet" type="button" disabled>Open</button>
    </div>
    <p id="url-status" class="hint"></p>

    <div class="pref-row">
      <label for="language">VSA language</label>
      <select id="language">
        <option value="auto">Detect automatically</option>
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="pref-row">
      <input id="notes-to-vsa" type="checkbox">
      <label for="notes-to-vsa">Send notes to VSA as day comments</label>
    </div>

    <div class="pref-row">
      <label for="cra-sheet">CRA sheet tab</label>
      <input id="cra-sheet" type="text" placeholder="Firstname LASTNAME (optional)">
    </div>
    <div class="pref-row">
      <label for="cra-url">CRA workbook URL</label>
      <input id="cra-url" type="url" placeholder="https://…sharepoint.com/… (optional)">
      <button id="cra-open" type="button" disabled>Open</button>
    </div>
  </details>

  <details id="holidays">
    <summary>Public holidays: <span id="holidays-country"></span> <span id="holidays-year"></span></summary>
    <p class="hint">Days ticked here are left out of a range unless you include bank holidays. The buttons below switch to the France, UK or USA list.</p>
    <table class="holiday-table">
      <tbody id="holiday-rules"></tbody>
    </table>
    <h2>Custom days off</h2>
    <table class="holiday-table">
      <tbody id="holiday-custom"></tbody>
    </table>
    <div class="pref-row">
      <input id="custom-date" type="date" aria-label="Day off date">
      <input id="custom-label" type="text" placeholder="Label (optional)" aria-label="Day off label">
      <button id="custom-add" type="button">Add</button>
    </div>
    <div class="actions">
      <button type="button" data-holidays-reset="fr">Reset to France defaults</button>
      <button type="button" data-holidays-reset="uk">Reset to UK defaults</button>
      <button type="button" data-holidays-reset="us">Reset to USA defaults</button>
    </div>
  </details>

  <div class="grid-scroll">
  <table id="grid">
    <colgroup>
      <col class="c-date">
      <col class="c-client">
      <col class="c-project">
      <col class="c-days">
      <col class="c-note">
      <col class="c-del">
    </colgroup>
    <thead>
      <tr>
        <th>Date</th><th>Client</th><th>Project</th><th>Days</th><th>Note</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot>
      <tr><td colspan="3" id="total-label">Total</td><td id="total">0</td><td colspan="2" id="row-count"></td></tr>
    </tfoot>
  </table>
  </div>

  <div class="actions">
    <button id="add-row" type="button">Add row</button>
    <button id="add-range" type="button">Add range</button>
    <button id="export" type="button">Export JSON</button>
    <button id="export-csv" type="button">Export CSV</button>
    <button id="copy-cra" type="button">Copy for CRA sheet</button>
    <button id="copy-admin" type="button">Copy projects for Admin</button>
    <button id="import" type="button">Import JSON</button>
    <input id="import-file" type="file" accept="application/json" hidden>
  </div>

  <section id="range" hidden aria-labelledby="range-title">
    <h2 id="range-title">Add range</h2>
    <div class="pref-row">
      <label for="range-client">Client</label>
      <select id="range-client"></select>
      <label for="range-project">Project</label>
      <select id="range-project"></select>
    </div>
    <div class="pref-row">
      <label for="range-days">Days</label>
      <input id="range-days" type="number" step="0.125" min="0" max="1">
      <label for="range-note">Note</label>
      <input id="range-note" type="text">
    </div>
    <div class="pref-row">
      <label for="range-from">From</label>
      <input id="range-from" type="date">
      <label for="range-to">To</label>
      <input id="range-to" type="date">
    </div>
    <div class="pref-row">
      <input id="range-weekends" type="checkbox">
      <label for="range-weekends">Include weekends</label>
      <input id="range-holidays" type="checkbox">
      <label for="range-holidays">Include bank holidays</label>
    </div>
    <p id="range-preview" class="hint"></p>
    <p id="range-skipped" class="hint"></p>
    <div class="actions">
      <button id="range-cancel" type="button">Cancel</button>
      <button id="range-submit" type="button" class="primary">Add rows</button>
    </div>
  </section>
  <textarea id="cra-fallback" rows="3" readonly hidden aria-label="CRA block to copy by hand"></textarea>

  <div class="actions vsa-actions">
    <button id="sync" type="button">Sync clients &amp; projects from VSA</button>
    <button id="reset-catalog" type="button" class="danger">Reset catalog</button>
    <button id="inject" type="button" class="primary">Inject this month into VSA</button>
  </div>

  <p id="status" role="status"></p>

  <script type="module" src="options.js"></script>
</body>
</html>
