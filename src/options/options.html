<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VSA Ext</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1>Shadow Tracking</h1>
    <div class="month-nav">
      <button id="prev-month" type="button">&lt;</button>
      <input id="month" type="month">
      <button id="next-month" type="button">&gt;</button>
    </div>
  </header>

  <section id="setup">
    <label for="timesheet-url">VSA timesheet URL</label>
    <div class="url-row">
      <input id="timesheet-url" type="url" placeholder="https://your-company.vsactivity.com/o_services/timesheetspivot/">
      <button id="save-url" type="button">Save &amp; grant access</button>
    </div>
    <p id="url-status" class="hint"></p>
  </section>

  <table id="grid">
    <colgroup>
      <col class="c-date">
      <col class="c-client">
      <col class="c-project">
      <col class="c-days">
      <col class="c-note">
      <col class="c-del">
    </colgroup>
    <thead>
      <tr>
        <th>Date</th><th>Client</th><th>Project</th><th>Days</th><th>Note</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot>
      <tr><td colspan="3">Total</td><td id="total">0</td><td colspan="2" id="row-count"></td></tr>
    </tfoot>
  </table>

  <div class="actions">
    <button id="add-row" type="button">Add row</button>
    <button id="export" type="button">Export JSON</button>
    <button id="export-csv" type="button">Export CSV</button>
    <button id="import" type="button">Import JSON</button>
    <input id="import-file" type="file" accept="application/json" hidden>
  </div>

  <div class="actions vsa-actions">
    <button id="sync" type="button">Sync clients &amp; projects from VSA</button>
    <button id="reset-catalog" type="button">Reset catalog</button>
    <button id="inject" type="button" class="primary">Inject this month into VSA</button>
  </div>

  <p id="status" role="status"></p>

  <script type="module" src="options.js"></script>
</body>
</html>
