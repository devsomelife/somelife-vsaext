name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# web-ext is pinned and bumped on purpose: a newer addons-linter can start
# flagging code that passed before.
env:
  WEB_EXT: web-ext@10.6.0

# The extension has no dependencies: browsers load the sources as they are, and
# the build script only copies them per browser and writes each manifest. These
# checks cover what actually breaks it: a syntax error, a failing test, or a
# manifest pointing at a file that is not there.
jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check every JavaScript file
        run: node .github/scripts/check-syntax.mjs

      # Coverage comes from Node's built-in test runner, so no dependency is
      # needed. It is informational for now: nothing fails on a low number.
      - name: Unit tests with coverage
        run: >
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info

      - name: Coverage summary
        run: node .github/scripts/coverage-summary.mjs lcov.info >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

      - name: Office Script bundles are up to date
        run: |
          node tools/cra-import/build.mjs
          git diff --exit-code -- tools/cra-import/dist

      - name: Build the Chrome and Firefox packages
        id: build
        run: |
          node .github/scripts/build-extension.mjs all --zip
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate both manifests
        run: |
          node .github/scripts/validate-manifest.mjs
          node .github/scripts/validate-manifest.mjs --target chrome --zip "vsa-ext-${{ steps.build.outputs.version }}.zip"
          node .github/scripts/validate-manifest.mjs --target firefox --zip "vsa-ext-firefox-${{ steps.build.outputs.version }}.zip"

      # addons-linter, the same checks addons.mozilla.org runs on upload. Errors
      # fail the build; the expected warnings (innerHTML on escaped values in
      # options.js, a Firefox for Android version note) do not.
      - name: Lint the Firefox package with web-ext
        run: npx --yes "$WEB_EXT" lint --source-dir build/firefox --no-config-discovery

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: vsa-ext-${{ steps.build.outputs.version }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: vsa-ext-firefox-${{ steps.build.outputs.version }}.zip
          if-no-files-found: error
