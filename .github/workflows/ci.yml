name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# The extension has no build step and no dependencies: Chrome loads the sources
# as they are. These checks cover what actually breaks it, which is a syntax
# error or a manifest pointing at a file that is not there.
jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check every JavaScript file
        run: node .github/scripts/check-syntax.mjs

      # Coverage comes from Node's built-in test runner, so no dependency is
      # needed. It is informational for now: nothing fails on a low number.
      - name: Unit tests with coverage
        run: >
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info

      - name: Coverage summary
        run: node .github/scripts/coverage-summary.mjs lcov.info >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

      - name: Office Script bundles are up to date
        run: |
          node tools/cra-import/build.mjs
          git diff --exit-code -- tools/cra-import/dist

      - name: Build archive and validate the manifest inside it
        run: |
          version=$(node -p "require('./manifest.json').version")
          zip -r -q "vsa-ext-${version}.zip" manifest.json src icons docs/guide.html
          node .github/scripts/validate-manifest.mjs --zip "vsa-ext-${version}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: vsa-ext-*.zip
          if-no-files-found: error
