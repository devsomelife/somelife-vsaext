name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0'
        required: true
        type: string

# Needed to push the version commit and tag, and to create the release.
permissions:
  contents: write

# Same pin as CI, so a release lints with the linter that passed on develop.
env:
  WEB_EXT: web-ext@10.6.0

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to detect an existing release, and the token is
          # persisted so the version commit can be pushed back.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set the version in manifest.json
        run: node .github/scripts/set-version.mjs "${{ inputs.version }}"

      # The release must not ship something that fails the normal checks, for
      # either browser. This runs before the tag guard and the commit, so a
      # failing package or Firefox lint never creates a tag.
      - name: Validate
        run: |
          node .github/scripts/check-syntax.mjs
          node .github/scripts/build-extension.mjs all --zip
          version=$(node -p "require('./manifest.json').version")
          node .github/scripts/validate-manifest.mjs
          node .github/scripts/validate-manifest.mjs --target chrome --zip "vsa-ext-${version}.zip"
          node .github/scripts/validate-manifest.mjs --target firefox --zip "vsa-ext-firefox-${version}.zip"
          npx --yes "$WEB_EXT" lint --source-dir build/firefox --no-config-discovery

      - name: Read the resulting version
        id: v
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists. Pick a different version."
            exit 1
          fi

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: release v${{ steps.v.outputs.version }}"
          git tag -a "v${{ steps.v.outputs.version }}" -m "v${{ steps.v.outputs.version }}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v${{ steps.v.outputs.version }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            "vsa-ext-${{ steps.v.outputs.version }}.zip" \
            "vsa-ext-firefox-${{ steps.v.outputs.version }}.zip" \
            --title "v${{ steps.v.outputs.version }}" \
            --generate-notes

      # Both stores take a manual upload for now.
      - name: Store upload reminder
        run: |
          {
            echo "## Store Uploads"
            echo ""
            echo "Both packages are attached to release v${{ steps.v.outputs.version }}. Upload them by hand:"
            echo ""
            echo "- Chrome Web Store: \`vsa-ext-${{ steps.v.outputs.version }}.zip\`"
            echo "- addons.mozilla.org, Firefox desktop: \`vsa-ext-firefox-${{ steps.v.outputs.version }}.zip\` (no source code upload needed)"
          } >> "$GITHUB_STEP_SUMMARY"
